services:
  - type: web
    name: lockwatch-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:packages && npm run build:backend
    startCommand: node services/backend/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: AUTO_MIGRATE
        value: "true"
      - key: RUN_WORKER
        value: "true"
      - key: HOST
        value: "0.0.0.0"
